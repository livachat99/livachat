# LivaChat + LiveKit server block for the Docker nginx container.
# The container uses host network, so upstream 127.0.0.1 is the Docker host.

server {
    listen 8444 ssl;
    # HTTP/2 is intentionally left off for the first cutover: this listener carries two
    # WebSocket endpoints, and nginx's WebSocket-over-HTTP/2 (RFC 8441) support is not
    # relied on here. Enable only after verifying both WSS endpoints.
    # http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:livachat_livekit_ssl:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    # Common upstream headers for normal HTTP requests. WebSocket locations below repeat
    # these explicitly and add Upgrade/Connection: once a location declares any
    # proxy_set_header, nginx no longer inherits the server-level header directives.
    # Keep the external Host (including 8060) so /meeting's 307 does not lose the port.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;

    # If the LivaChat upstream uses TLS (server.ssl.enabled=true), uncomment:
    # proxy_ssl_verify off;
    # proxy_ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml
        application/wasm;

    access_log /var/log/nginx/livachat_livekit.access.log livachat_livekit_noargs;

    # ---------------- LiveKit signaling ----------------
    # Reserve /rtc and /rtc/...; LiveKit's client appends /rtc to the configured wss URL.
    # No LivaChat route starts with /rtc.
    location ^~ /rtc {
        proxy_pass http://127.0.0.1:7880;

        # Repeated because location-level proxy_set_header disables server-level inheritance.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---------------- LivaChat WebSocket ----------------
    location = /v1/ws/stream {
        proxy_pass http://127.0.0.1:8080;

        # Repeated because location-level proxy_set_header disables server-level inheritance.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------- Health ----------------
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /healthz_token {
        proxy_pass http://127.0.0.1:8080;
    }

    # ---------------- Media / Range ----------------
    location ^~ /api/mylife/media/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ---------------- BFF / API ----------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # ---------------- Agent webroot ----------------
    location ^~ /webroot/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # ---------------- Meeting SPA ----------------
    location = /meeting/config.json {
        proxy_pass http://127.0.0.1:8080;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /meeting/assets/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /meeting/vendor/mediapipe/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # /meeting/ and /meeting/<meeting-number> both serve the SPA.
    location ^~ /meeting/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # /meeting without the trailing slash: let the backend issue its 307.
    location = /meeting {
        proxy_pass http://127.0.0.1:8080;
    }

    # ---------------- Fallback ----------------
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
