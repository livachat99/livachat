apiVersion: v1
kind: Service
metadata:
  name: livachat-server
  labels:
    app: livachat-server
spec:
  type: ClusterIP
  selector:
    app: livachat-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: livachat-server-headless
  labels:
    app: livachat-server
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: livachat-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
