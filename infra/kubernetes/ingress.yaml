apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livachat-server
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: livachat-server
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "LIVACHAT_STICKY"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.livachat.example.com
      secretName: livachat-tls
  rules:
    - host: api.livachat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livachat-server
                port:
                  number: 8080
