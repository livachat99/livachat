apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: livachat-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: livachat-server
  # 单副本约束（docs/chatserver_no_redis.md §4.4 D4）：多实例能力放弃，横向扩容被钉死
  # 为 1；待引入外部协调组件（共享事件总线等）后再放开 min/max
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
