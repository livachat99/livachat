# Example Secret — replace values with actual keys.  DO NOT COMMIT real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: livachat-secrets
type: Opaque
stringData:
  APP_AUTH_TOKEN: "dev-livachat-token"
  LIVACHAT__REDIS__URL: "redis://redis:6379/0"
  DEEPGRAM_API_KEY: "<deepgram-key>"
  DASHSCOPE_API_KEY: "<dashscope-key>"
  OPENROUTER_API_KEY: "<openrouter-key>"
  DEEPSEEK_API_KEY: "<deepseek-key>"
  CARTESIA_API_KEY: "<cartesia-key>"
  ELEVENLABS_API_KEY: "<elevenlabs-key>"
