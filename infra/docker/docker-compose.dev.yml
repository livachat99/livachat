services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: livachat
      POSTGRES_PASSWORD: livachat
      POSTGRES_DB: livachat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livachat"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  server:
    build:
      context: ../..
      dockerfile: infra/docker/server.Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      LIVACHAT__REDIS__URL: "redis://redis:6379/0"
      APP_AUTH_TOKEN: "dev-livachat-token"
      LIVACHAT_INSTANCE_ID: "dev-docker"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
