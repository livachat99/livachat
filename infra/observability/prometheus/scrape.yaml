# Prometheus scrape configuration for LivaChat Server
# Mount as /etc/prometheus/scrape/livachat.yaml or merge into prometheus.yml

scrape_configs:
  - job_name: livachat-server
    metrics_path: /metrics
    scheme: http
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - livachat
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: livachat-server
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: metrics
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
    scrape_interval: 15s
    scrape_timeout: 10s
