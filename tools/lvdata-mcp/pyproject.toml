[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lvdata-mcp"
version = "0.1.0"
description = "LvData MCP Service — query + ingestion planes for livachat recorded data"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12,<2",  # 2.x 移除 mcp.server.fastmcp（tools.py 依赖 1.x Tool.from_function）
    "openai>=1.52",  # 分析 provider（audio/vision/summary/embedding 全部 AsyncOpenAI）
    "pyyaml>=6.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24",
    "certifi>=2026.10.18",  # GHSA-6q48-6c7w-9gw2（emSign 中间 CA 私钥泄露）
]

[project.optional-dependencies]
image = ["Pillow>=13.0.0"]  # 12.3.0 命中 59 条 OSV（含 JPEG/FPX 解码 RCE）
vec = ["sqlite-vec>=0.1"]
dev = ["pytest>=8"]

[project.scripts]
lvdata-mcp = "lvdata_mcp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
